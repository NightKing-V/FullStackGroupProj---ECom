services:
  frontend_service:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_service
    restart: always
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    volumes:
      - app-data:/var/www/html
      - ./.env:/var/www/html/public/.env
    networks:
      - app-network

  backend_service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_service
    restart: always
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_SEED=true
      - MONGO_USERNAME=root
      - MONGO_PASSWORD=passw0rd123!
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DATABASE=ecomdb
    volumes:
      - backend-data:/usr/src/app
      - ./.env:/usr/src/app/.env
    depends_on:
      - mongodb
    networks:
      - app-network

  nginx:
    image: nginx:mainline-alpine-slim
    container_name: nginx_service
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - app-data:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certificate.crt:/etc/ssl/certs/certificate.crt
      - ./nginx/private.key:/etc/ssl/private/private.key
    networks:
      - app-network

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=passw0rd123!
      - MONGO_INITDB_DATABASE=ecomdb
    volumes:
      - mongodb-data:/data/db
    networks:
      - app-network

  mongo-express:
    image: mongo-express:latest
    container_name: mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=root
      - ME_CONFIG_MONGODB_ADMINPASSWORD=passw0rd123!
      # - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_URL=mongodb://root:passw0rd123!@mongodb:27017/
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongodb
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  app-data: {}
  backend-data: {}
  mongodb-data: {}
