services:
  frontend_service:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_service
    restart: always
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - NEXT_API_BASE_URL=http://backend:5000
    volumes:
      - app-data:/var/www/html
      - ./.env:/var/www/html/public/.env
    networks:
      - app-network

  backend_service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_service
    restart: always
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_SEED=true
      - MONGO_USERNAME=root
      - MONGO_PASSWORD=passw0rd123!
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DATABASE=xsoles_db
      - JWT_SECRET_KEY=xsol123es
      - SALT_VALUE=10
      - PAYMENT_GATEWAY_URL=http://mockpay_service:8083/payment/initiate
      - PAYMENT_API_KEY=19921c95610639ccf13b2be8ac923d793169b1b933eabe96c132d0edccb26a39
    volumes:
      - backend-data:/usr/src/app
      - ./.env:/usr/src/app/.env
    depends_on:
      - mongodb
    networks:
      - app-network

  nginx:
    image: nginx:mainline-alpine-slim
    container_name: nginx_service
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - app-data:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certificate.crt:/etc/ssl/certs/certificate.crt
      - ./nginx/private.key:/etc/ssl/private/private.key
    networks:
      - app-network

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=passw0rd123!
      - MONGO_INITDB_DATABASE=ecomdb
    volumes:
      - mongodb-data:/data/db
    networks:
      - app-network

  mongo-express:
    image: mongo-express:latest
    container_name: mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=root
      - ME_CONFIG_MONGODB_ADMINPASSWORD=passw0rd123!
      # - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_URL=mongodb://root:passw0rd123!@mongodb:27017/
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongodb
    networks:
      - app-network

  mockpay_service:
    image: diyrex5224/mockpay:latest
    container_name: mockpay_service
    restart: always
    environment:
      - MONGO_CONN_STRING=mongodb://root:passw0rd123!@mongodb:27017/xsoles_db?authSource=admin
      - APP_URL=http://mockpay.localhost
      - REDIRECT_CALLBACK_URL=http://backend_service:5000/api/v1/order/payment-callback
      - REDIRECT_URL=http://fe.localhost
      - PAYMENT_API_KEY=19921c95610639ccf13b2be8ac923d793169b1b933eabe96c132d0edccb26a39
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  app-data: {}
  backend-data: {}
  mongodb-data: {}
