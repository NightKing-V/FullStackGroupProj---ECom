services:
  web-frontend:
    image: ${ansi_frontend_image}
    container_name: app
    restart: always
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    volumes:
      - app-data:/var/www/html
      - ./.env:/var/www/html/public/.env
    networks:
      - app-network

  backend:
    image: ${ansi_backend_image}
    container_name: backend_service
    restart: always
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_SEED=true
      - MONGO_URI=mongodb://root:example@mongodb:27017/mydatabase
      - MONGO_USERNAME=root
      - MONGO_PASSWORD=passw0rd123!
      - MONGO_DATABASE=ecomdb
    volumes:
      - backend-data:/usr/src/app
      - ./.env:/usr/src/app/.env
    depends_on:
      - mongodb
    networks:
      - app-network

  nginx:
    image: nginx:mainline-alpine-slim
    container_name: nginx_service
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - app-data:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certificate.crt:/etc/ssl/certs/certificate.crt
      - ./nginx/private.key:/etc/ssl/private/private.key
    networks:
      - app-network

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=passw0rd123!
      - MONGO_INITDB_DATABASE=ecomdb
    volumes:
      - mongodb-data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  app-data: {}
  backend-data: {}
  mongodb-data: {}
