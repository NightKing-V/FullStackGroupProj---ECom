services:
  frontend:
    image: ${ansi_frontend_image}
    container_name: app
    restart: always
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    volumes:
      - app-data:/var/www/html
      - ./.env:/var/www/html/public/.env
    networks:
      - app-network

  backend:
    image: ${ansi_backend_image}
    container_name: backend_service
    restart: always
    environment:
      environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_SEED=true
      - MONGO_USERNAME=root
      - MONGO_PASSWORD=passw0rd123!
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DATABASE=xsoles_db
      - JWT_SECRET_KEY=xsol123es
      - SALT_VALUE=10
      - PAYMENT_GATEWAY_URL=http://localhost:8083/payment/initiate
      - PAYMENT_API_KEY=19921c95610639ccf13b2be8ac923d793169b1b933eabe96c132d0edccb26a39
    volumes:
      - backend-data:/usr/src/app
      - ./.env:/usr/src/app/.env
    depends_on:
      - mongodb
    networks:
      - app-network

  nginx:
    image: nginx:mainline-alpine-slim
    container_name: nginx_service
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - app-data:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certificate.crt:/etc/ssl/certs/certificate.crt
      - ./nginx/private.key:/etc/ssl/private/private.key
    networks:
      - app-network

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=passw0rd123!
      - MONGO_INITDB_DATABASE=ecomdb
    volumes:
      - mongodb-data:/data/db
    networks:
      - app-network

  mockpay:
  image: diyrex5224/mockpay:latest
  container_name: mockpay
  restart: always
  environment:
    - MONGO_CONN_STRING=mongodb://root:passw0rd123!@mongodb:27017/xsoles_db?authSource=admin
    - APP_URL=http://mockpay:8083
    - REDIRECT_CALLBACK_URL=http://backend:5000/api/v1/order/payment-callback
    - REDIRECT_URL=http://frontend:3000
    - PAYMENT_API_KEY=19921c95610639ccf13b2be8ac923d793169b1b933eabe96c132d0edccb26a39
  volumes:
    - mongodb-data:/data/db
  networks:
    - app-network
      

networks:
  app-network:
    driver: bridge

volumes:
  app-data: {}
  backend-data: {}
  mongodb-data: {}
