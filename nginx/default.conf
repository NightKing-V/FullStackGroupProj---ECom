# Define upstreams for each service
upstream frontend_upstream {
    server frontend_service:3000;
}

upstream backend_upstream {
    server backend_service:5000;
}

upstream mongo_express_upstream {
    server mongo_express:8081;
}

upstream mockpay_upstream {
    server mockpay_service:8083;
}

# Frontend service (fe.localhost)
server {
    listen 80;
    server_name fe.localhost;

    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Backend service (be.localhost)
server {
    listen 80;
    server_name be.localhost;

    location / {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Mongo Express service (me.localhost)
server {
    listen 80;
    server_name me.localhost;

    location / {
        proxy_pass http://mongo_express_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Mockpay Service
server {
    listen 80;
    server_name mockpay.localhost;

    location / {
        proxy_pass http://mockpay_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}